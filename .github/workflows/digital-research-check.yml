name: Verificar Pesquisa digital
on:
  pull_request:
    paths:
      - 'src/features/digital-research/**'
      - 'src/routes/pesquisa-digital.tsx'
      - 'src/features/demo/shell.tsx'
      - 'src/features/panel/home.tsx'
      - 'src/features/finance/**'
      - 'src/features/payments/wallet.tsx'
      - 'supabase/functions/astros-digital-research/**'
      - 'supabase/astros-digital-research.deploy.ts'
      - 'supabase/migrations/20261028_digital*.sql'
      - 'scripts/*digital*'
      - 'tests/digital-preview/**'
      - '.github/workflows/digital-research-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run build:dev
      - run: bunx tsc --noEmit
      - run: bun run test -- src/features/digital-research src/features/prospecting src/features/module-access src/features/finance src/features/payments src/features/panel src/features/admin src/features/updates
      - name: Transações SQL e compatibilidade financeira
        run: |
          npm install --no-save --ignore-scripts --no-package-lock @electric-sql/pglite@0.5.13
          node scripts/check-digital-research.mjs
      - name: Verificar arquivo de deploy
        run: |
          python3 scripts/generate-digital-deploy.py
          git diff --exit-code -- supabase/astros-digital-research.deploy.ts
      - run: ASTROS_DEPLOY_TARGET=vps bun run build
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.1
      - run: npx playwright install chromium --with-deps
      - name: Verificar layout real com dados sintéticos
        run: |
          mkdir -p /tmp/digital-shots
          bunx vite --config tests/digital-preview/vite.config.ts --host 127.0.0.1 --port 4187 > /tmp/digital-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4187/ >/dev/null && break || sleep 1; done
          node scripts/check-digital-layout.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: digital-research-preview
          path: /tmp/digital-shots
