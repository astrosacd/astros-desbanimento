name: Verificar responsividade do painel
on:
  pull_request:
    paths:
      - 'src/**/*.tsx'
      - 'src/**/*.css'
      - 'tests/responsive-preview/**'
      - 'scripts/check-responsive-layout.mjs'
      - '.github/workflows/responsive-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install chromium --with-deps
      - name: Telas reais com dados sintéticos, sem chamadas de produção
        run: node scripts/check-responsive-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painel-responsive-layout
          path: /tmp/responsive-shots
